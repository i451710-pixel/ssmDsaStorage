<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倉存管理系統</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --border:#e3e7ee; --text:#1e2430; --muted:#7a8395;
  --accent:#2563eb; --accent-d:#1d4ed8;
  --yellow:#fff6d6; --yellow-b:#f2b705;
  --red:#ffe1e1;   --red-b:#e5484d;
  --green:#f0fdf4; --green-b:#16a34a; --green-d:#15803d; --green-l:#bbf7d0;
  --side:#111827; --side-hover:#1f2937;
  --page-h:64px;
  --area-h:40px;
}
*{box-sizing:border-box}
html{font-size:16px}
html,body{height:100%}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
     font-size:.84rem;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c7cdd8;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

#login{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,#1e3a8a,#0b1220 70%)}
.login-box{width:340px;background:#fff;border-radius:16px;padding:38px 30px 30px;
  box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.login-box h1{margin:0 0 24px;font-size:1.25rem;letter-spacing:1px}
#empInput{width:100%;padding:13px 14px;font-size:1.25rem;letter-spacing:6px;text-align:center;
  border:2px solid var(--border);border-radius:10px;outline:none;transition:.15s}
#empInput:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
#loginBtn{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);
  color:#fff;font-size:.94rem;font-weight:600;transition:.15s}
#loginBtn:hover{background:var(--accent-d)}
.err{color:var(--red-b);font-size:.75rem;height:16px;margin-top:8px}

#app{display:none;height:100vh}
#app.on{display:flex}
#sidebar{width:250px;flex:none;background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;transition:width .18s}
#sidebar.collapsed{width:0;overflow:hidden}
.brand{padding:16px 16px 12px;font-size:.94rem;font-weight:700;color:#fff;letter-spacing:1px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid #1f2937}
.side-scroll{flex:1;overflow-y:auto;padding:8px 8px 8px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;margin-bottom:2px;
  cursor:pointer;font-size:.81rem;user-select:none;position:relative;transition:.12s}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .ic{width:18px;text-align:center;flex:none}
.nav-item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .del{opacity:0;font-size:.75rem;padding:2px 4px;border-radius:4px}
.nav-item:hover .del{opacity:.75}
.nav-item .del:hover{opacity:1;background:rgba(255,255,255,.18)}
.nav-item .dh{opacity:.35;font-size:.69rem;cursor:grab;letter-spacing:-2px}
.nav-item.dragging{opacity:.4}
.nav-item.drop-target{outline:2px dashed var(--accent);outline-offset:-2px}
.nav-item input.ren{width:100%;background:#fff;color:#111;border:0;border-radius:4px;padding:2px 4px;
  font-size:.81rem;outline:none}
.side-foot{padding:8px;border-top:1px solid #1f2937}
.side-foot button{width:100%;padding:9px;border:1px dashed #475569;background:transparent;color:#94a3b8;
  border-radius:8px;font-size:.78rem;transition:.15s}
.side-foot button:hover{border-color:var(--accent);color:#fff;background:rgba(37,99,235,.2)}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{min-height:56px;flex:none;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;z-index:200;position:relative}
#menuBtn{border:0;background:transparent;font-size:1.125rem;padding:6px 8px;border-radius:6px;color:var(--muted)}
#menuBtn:hover{background:#eef2f7}
#search{flex:1;min-width:180px;max-width:520px;padding:8px 12px;border:1px solid var(--border);border-radius:9px;
  outline:none;font-size:.81rem;background:#f8fafc;transition:.15s}
#search:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{padding:7px 13px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:.78rem;
  color:var(--text);transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);background:#f5f9ff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d);color:#fff}
.btn.danger:hover{border-color:var(--red-b);color:var(--red-b);background:#fff5f5}
.btn.sm{padding:4px 9px;font-size:.75rem}
.grow{flex:1}
.font-ctrl{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:8px;
  padding:2px 4px;background:#fafbfd}
.font-ctrl button{border:0;background:transparent;font-size:.81rem;font-weight:700;color:var(--muted);
  padding:3px 7px;border-radius:6px;line-height:1}
.font-ctrl button:hover{background:#eef4ff;color:var(--accent)}
.font-ctrl span{font-size:.69rem;color:var(--muted);min-width:34px;text-align:center}

#content{flex:1;overflow-y:auto;padding:0 18px 60px;position:relative}

.page-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;
  background:var(--bg);
  padding:16px 0 14px;
  margin:0;
}
.page-head h2{margin:0;font-size:1.06rem}
.pill{background:#eef2ff;color:#4338ca;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:600}
.empty{background:#fff;border:1px dashed var(--border);border-radius:12px;padding:40px;text-align:center;
  color:var(--muted);font-size:.81rem}

.area{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:16px;
  position:relative;
}
.area.dragging-area{opacity:.4}
.area.drop-target-area{outline:2px dashed var(--accent);outline-offset:-2px}

.area-head{
  display:flex;align-items:center;gap:6px;padding:9px 12px;
  background:#fafbfd;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
  position:sticky;
  top:var(--page-h);
  z-index:90;
  border-radius:11px 11px 0 0;
  cursor:pointer;
  user-select:none;
  transition:background .12s;
}
.area-head:hover{background:#f4f7fc;}
.area.collapsed .area-head{border-bottom:none;border-radius:11px}
.area.collapsed .hrow,
.area.collapsed .row{display:none}

.area-head .area-name{cursor:text;user-select:text;}
.area-head input,
.area-head button,
.area-head .area-drag-handle{cursor:auto;}
.area-head .area-drag-handle{cursor:grab;}

.area-drag-handle{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;flex:none;cursor:grab;color:#c3cad6;font-size:.875rem;
  user-select:none;padding:2px 0;line-height:1;
}
.area-drag-handle:hover{color:var(--accent)}
.area-drag-handle:active{cursor:grabbing}
.collapse-toggle{
  border:0;background:transparent;color:#7a8395;font-size:.69rem;padding:3px 6px;
  border-radius:5px;line-height:1;cursor:pointer;transition:transform .15s;
  user-select:none;flex:none;
}
.collapse-toggle:hover{background:#eef2f7;color:var(--accent)}
.area.collapsed .collapse-toggle{transform:rotate(-90deg)}
.area-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.area-name{border:0;background:transparent;font-weight:700;font-size:.84rem;padding:3px 6px;
  border-radius:6px;outline:none;min-width:120px;width:auto}
.area-name:hover{background:#eef2f7}
.area-name:focus{background:#fff;box-shadow:0 0 0 2px var(--accent) inset}
.count{font-size:.72rem;color:var(--muted);background:#eef2f7;padding:2px 8px;border-radius:20px}

.hrow,.row{display:flex;align-items:stretch;border-bottom:1px solid #eef1f6}
.hrow{
  background:#f7f9fc;
  position:sticky;
  top:calc(var(--page-h) + var(--area-h));
  z-index:80;
}
.row:last-child{border-bottom:0;border-radius:0 0 11px 11px}
.hrow:last-child{border-radius:0 0 11px 11px}
.row:hover{background:#fafbfe}
.row.red{background:var(--red);box-shadow:inset 3px 0 0 var(--red-b)}
.row.red:hover{background:#ffd7d7}
.row.yellow{background:var(--yellow);box-shadow:inset 3px 0 0 var(--yellow-b)}
.row.yellow:hover{background:#ffefbe}
.row.dragging-row{opacity:.35}
.row.drop-target-row{outline:2px dashed var(--accent);outline-offset:-2px;background:#eef4ff}
.cell{padding:6px 8px;border-right:1px solid #eef1f6;display:flex;flex-direction:column;
  justify-content:flex-start;gap:3px;min-width:0;position:relative;overflow:hidden}
.cell:last-child{border-right:0}
.hcell{font-weight:700;font-size:.75rem;color:#5b6478;flex-direction:row;align-items:center;
  justify-content:flex-start;user-select:none;padding:8px}
.rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:6}
.rz:hover{background:rgba(37,99,235,.35)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing *{cursor:col-resize !important}

.item-drag-handle{
  display:inline-flex;align-items:center;justify-content:center;
  width:14px;flex:none;cursor:grab;color:#c3cad6;font-size:.875rem;
  user-select:none;padding:2px 0;line-height:1;margin-top:2px;
}
.item-drag-handle:hover{color:var(--accent)}
.item-drag-handle:active{cursor:grabbing}

.qty-wrap, .expiry-wrap{display:flex;flex-direction:column;gap:3px;width:100%;}
.qty-main-row, .expiry-main-row{display:flex;gap:3px;align-items:center;min-height:30px;box-sizing:border-box;}
.qty-main-row .inp{flex:1;min-width:36px;}

.add-extra-btn{
  flex:none;width:22px;height:22px;padding:0;font-size:.875rem;line-height:1;font-weight:700;
  border-radius:5px;background:#eef4ff;color:var(--accent);border:1px solid #c7d8f7;
  transition:.12s;display:inline-flex;align-items:center;justify-content:center;
}
.add-extra-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.add-extra-btn:active{transform:scale(.95);}

.qty-extra-row, .expiry-extra-row{
  display:flex;gap:3px;align-items:center;min-height:28px;padding:2px 3px;box-sizing:border-box;
  background:#f8fafc;border:1px solid #eef1f6;border-radius:5px;
}
.qty-extra-row .extra-qty{flex:1;min-width:36px;text-align:center;font-size:.75rem;padding:3px 4px;border-color:transparent;background:transparent;}
.qty-extra-row .extra-qty:hover{border-color:#dbe1ea;background:#fff;}
.qty-extra-row .mini{padding:1px 5px;font-size:.72rem;flex:none;}

.expiry-extra-row .extra-exp{flex:1;min-width:60px;font-size:.75rem;padding:3px 4px;letter-spacing:.5px;text-align:center;border-color:transparent;background:transparent;}
.expiry-extra-row .extra-exp:hover{border-color:#dbe1ea;background:#fff;}

.expiry-main-row .exp-inp{flex:1;min-width:0;}

.no-expiry-btn{
  display:block;width:100%;min-height:28px;margin-top:2px;font-size:.72rem;padding:6px 8px;
  border-radius:5px;background:var(--green);color:var(--green-d);border:1px solid var(--green-l);
  line-height:1;font-weight:600;cursor:pointer;transition:.12s;text-align:center;box-sizing:border-box;
}
.no-expiry-btn:hover{background:var(--green-b);color:#fff;border-color:var(--green-b);}
.no-expiry-btn:active{transform:scale(.98);}

.no-expiry-label{
  display:flex;align-items:center;justify-content:center;gap:5px;background:var(--green);color:var(--green-d);
  padding:8px 10px;border-radius:6px;font-size:.84rem;font-weight:600;border:1px solid var(--green-l);
  width:100%;cursor:pointer;transition:.12s;user-select:none;text-align:center;
}
.no-expiry-label:hover{background:var(--green-b);color:#fff;border-color:var(--green-b);}
.no-expiry-label:active{transform:scale(.98);}

.supplier-drag-handle{
  display:inline-flex;align-items:center;justify-content:center;width:16px;flex:none;cursor:grab;
  color:#c3cad6;font-size:.875rem;user-select:none;padding:2px 0;line-height:1;
}
.supplier-drag-handle:hover{color:var(--accent)}
.supplier-drag-handle:active{cursor:grabbing}

.contacts-list, .phone-list, .ct-tags-list{display:flex;flex-direction:column;gap:0;width:100%;}
.contact-block, .phone-block, .ct-tags-block{
  display:flex;align-items:center;min-height:2rem;padding:2px 6px;box-sizing:border-box;
  border-bottom:1px dashed #eef1f6;transition:height .12s ease;
}
.contact-block:last-child, .phone-block:last-child, .ct-tags-block:last-child{border-bottom:none;}
.contact-block.dragging-contact{opacity:.35}
.contact-block.drop-target-contact{outline:2px dashed var(--accent);outline-offset:-2px;background:#eef4ff}
.contact-head{display:flex;align-items:center;gap:5px;width:100%;}
.contact-drag-handle{
  display:inline-flex;align-items:center;justify-content:center;width:14px;flex:none;cursor:grab;
  color:#c3cad6;font-size:.75rem;user-select:none;line-height:1;
}
.contact-drag-handle:hover{color:var(--accent)}
.contact-drag-handle:active{cursor:grabbing}
.contact-head .inp{flex:1;min-width:60px;}
.phone-block .inp{flex:1;min-width:60px;}
.ct-tag-list{display:flex;flex-wrap:wrap;gap:3px;flex:1;align-items:center;}

.add-row, .add-row-placeholder{min-height:1.5rem;padding:2px 6px;box-sizing:border-box;display:flex;align-items:center;}
.add-row-placeholder{visibility:hidden;}

.tag-mini{
  display:inline-flex;align-items:center;gap:3px;background:#eef2ff;color:#4338ca;border-radius:12px;
  padding:1px 6px;font-size:.69rem;line-height:1.4;
}
.tag-mini b{cursor:pointer;font-weight:400;opacity:.6;font-size:.72rem}
.tag-mini b:hover{opacity:1;color:var(--red-b)}
.tag-add{
  border:1px dashed #cbd5e1;background:transparent;border-radius:12px;padding:1px 7px;font-size:.69rem;
  outline:none;width:56px;line-height:1.4;color:var(--muted);
}
.tag-add:focus{border-style:solid;border-color:var(--accent);background:#fff;color:var(--text);width:84px;}

.inp{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;
  font-size:.81rem;outline:none;transition:.12s;color:var(--text)}
.inp:hover{border-color:#dbe1ea;background:#fff}
.inp:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.inp.num{text-align:center}

.inp.dup{border-color:var(--red-b)!important;background:#fff5f5!important;box-shadow:0 0 0 3px rgba(229,72,77,.15)!important;}
.code-wrap{display:flex;flex-direction:column;gap:2px;min-width:0;}
.code-warn{
  font-size:.69rem;color:var(--red-b);line-height:1.3;background:#fff5f5;border:1px solid #ffd4d4;
  border-radius:5px;padding:2px 6px;word-break:break-all;
}

.name-area{
  resize:none;overflow:hidden;min-height:28px;line-height:1.4;font-family:inherit;word-break:break-word;
  white-space:pre-wrap;display:block;width:100%;
}

.out-btn{border:1px solid #cfd6e0;background:#fff;border-radius:6px;padding:4px 6px;font-size:.72rem;
  color:var(--muted);font-weight:600;transition:.13s;align-self:flex-start}
.out-btn:hover{border-color:var(--red-b);color:var(--red-b)}
.out-btn.on{background:var(--red-b);border-color:var(--red-b);color:#fff}
.icon-btn{border:0;background:transparent;color:#b9c0cc;font-size:.875rem;padding:4px 6px;border-radius:6px}
.icon-btn:hover{background:#ffe9e9;color:var(--red-b)}
.exp-inp{letter-spacing:1px;font-variant-numeric:tabular-nums;text-align:center}
.cprev{margin-top:2px;line-height:0}
.cprev svg{max-width:100%;height:auto;display:block}

.notes{display:flex;flex-direction:column;gap:0}
.note-line{display:flex;align-items:center;gap:3px;height:28px}
.note-line .inp{font-size:.78rem;height:26px;padding:3px 6px}
.mini{border:0;background:transparent;color:#b9c0cc;font-size:.75rem;padding:1px 4px;border-radius:4px}
.mini:hover{background:#eef2f7;color:var(--red-b)}
.mini.add{color:#9aa4b5;font-size:.69rem;padding:2px 6px;border-radius:6px;align-self:flex-start}
.mini.add:hover{background:#eef4ff;color:var(--accent)}

.tag{display:inline-flex;align-items:center;gap:4px;background:#eef2ff;color:#4338ca;border-radius:20px;
  padding:3px 8px;font-size:.72rem;margin:2px 3px 2px 0}
.tag b{cursor:pointer;font-weight:400;opacity:.6;font-size:.75rem}
.tag b:hover{opacity:1;color:var(--red-b)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat .n{font-size:1.5rem;font-weight:700;line-height:1.2}
.stat .l{font-size:.75rem;color:var(--muted);margin-top:2px}
.stat.warn .n{color:var(--yellow-b)} .stat.bad .n{color:var(--red-b)} .stat.ok .n{color:#16a34a}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1500;display:flex;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:86vh;display:flex;
  flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .16s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--border);font-size:.94rem}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input[type=text],.field select{width:100%;padding:9px 11px;border:1px solid var(--border);
  border-radius:8px;outline:none;font-size:.84rem}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.checklist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;
  border:1px solid var(--border);border-radius:9px;padding:6px}
.checklist label{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;
  cursor:pointer;font-size:.81rem}
.checklist label:hover{background:#f5f8fd}
.radio-row{display:flex;gap:14px;font-size:.81rem}
.radio-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.danger-note{background:#fff5f5;border:1px solid #ffd4d4;color:#b42318;border-radius:9px;padding:10px 12px;
  font-size:.78rem;line-height:1.6}

#ctxmenu{position:fixed;z-index:3000;background:#fff;border:1px solid var(--border);border-radius:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.16);padding:5px;min-width:220px;
  max-width:340px;display:none;max-height:400px;overflow-y:auto;
  overscroll-behavior:contain;}
#ctxmenu .ctx-t{font-size:.69rem;color:var(--muted);padding:5px 10px 3px;font-weight:700;
  position:sticky;top:0;background:#fff;z-index:1}
#ctxmenu .ctx-i{padding:7px 12px;border-radius:7px;font-size:.81rem;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctxmenu .ctx-i:hover{background:#eef4ff;color:var(--accent)}
#ctxmenu .ctx-check{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
  cursor:pointer;font-size:.81rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctxmenu .ctx-check:hover{background:#eef4ff}
#ctxmenu .ctx-check input{cursor:pointer;flex:none}
#ctxmenu .ctx-check span{overflow:hidden;text-overflow:ellipsis}
#ctxmenu .ctx-actions{display:flex;gap:6px;padding:6px 5px 3px;border-top:1px solid #eef1f6;margin-top:3px;
  position:sticky;bottom:0;background:#fff}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('on'), 2000);
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      resolve();
    }catch(e){ reject(e); }
  });
}

let state = {

let saveTimer = null;
let isSavingLocally = false;

function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}

  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!window.firebaseAPI) return;
    const { doc, setDoc, db, authReady } = window.firebaseAPI;
    try {
      await authReady;
      isSavingLocally = true;
      const docRef = doc(db, "wms_data", "main");

        stateData: state,
        deviceSecret: DEVICE_SECRET,

    } catch (error) {
      isSavingLocally = false;
      console.error("❌ 倉存資料同步失敗:", error);
    }
  }, 1000);
}

function migrateData(data){
  if(!data || !Array.isArray(data.pages)) return;
  data.pages.forEach(p => {
    if(!p.areas) p.areas = [];
    p.areas.forEach(a => {
      if(!a.items) a.items = [];
      if(typeof a.collapsed !== 'boolean') a.collapsed = false;
      a.items.forEach(it => {
        if(p.type === 'supplier'){
          if(!Array.isArray(it.contacts)) it.contacts = [];
          it.contacts.forEach(c => {
            if(!Array.isArray(c.tags)) c.tags = [];
            if(typeof c.name !== 'string') c.name = '';
            if(typeof c.phone !== 'string') c.phone = '';
          });
        }
        if(p.type === 'common' || p.type === 'special' || p.type === 'consign'){
          if(!Array.isArray(it.contactList)){
            it.contactList = it.contact ? [it.contact] : [];
          }
          delete it.contact;
        }
        if(p.type !== 'supplier'){
          if(!Array.isArray(it.notes)) it.notes = [''];
        }
        if(p.type === 'common' || p.type === 'special'){
          if(!Array.isArray(it.extras)) it.extras = [];
          it.extras.forEach(ex => {
            if(typeof ex.qty !== 'number') ex.qty = 0;
            if(typeof ex.expiry !== 'string') ex.expiry = '';
          });
          if(typeof it.noExpiry !== 'boolean') it.noExpiry = false;
        }
      });
    });
  });
}

async function loadStateFromCloud() {
  // 等待 Firebase 載入完成
  let retries = 0;
  while (!window.firebaseAPI && retries < 10) {
    await new Promise(r => setTimeout(r, 500));
    retries++;
  }
  if (!window.firebaseAPI) {
    console.error("❌ Firebase 模組載入失敗");
    return;
  }

  try {
    const { doc, getDoc, db, authReady } = window.firebaseAPI;
    await authReady;
    const docRef = doc(db, "wms_data", "main");
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {
      const d = docSnap.data().stateData;
      if(!d || typeof d !== 'object') return;
      
      state.pages     = Array.isArray(d.pages) ? d.pages : [];
      state.colWidths = d.colWidths || {};
      state.codeMode  = d.codeMode === 'barcode' ? 'barcode' : 'qrcode';
      state.empId     = d.empId || '';
      state.fontScale = typeof d.fontScale === 'number' ? d.fontScale : 1;
      state.customContacts = Array.isArray(d.customContacts) ? d.customContacts : [];
      migrateData(state);
      console.log("✅ 已從雲端載入倉存資料");
    }
  } catch (e) {
    console.error("雲端讀取失敗，使用本地快取", e);
  }
}

function initRealtimeListener() {
    if (!window.firebaseAPI) return;
    const { doc, onSnapshot, db } = window.firebaseAPI;
    const docRef = doc(db, "wms_data", "main");

    onSnapshot(docRef, (docSnap) => {
        if (!docSnap.exists()) return;
        if (isSavingLocally || docSnap.metadata.hasPendingWrites) return;

        const cloudState = docSnap.data().stateData;
        if (!cloudState) return;
        
        if (JSON.stringify(state.pages) !== JSON.stringify(cloudState.pages)) {
            console.log("🔄 偵測到其他設備更新，正在同步畫面...");
            
            const active = document.activeElement;
            const isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
            const scrollPos = $('#content').scrollTop;

            state.pages = cloudState.pages;
            state.customContacts = cloudState.customContacts || [];
            
            if (!isTyping) {
                render();
                $('#content').scrollTop = scrollPos;
                toast("🔄 已同步其他設備的資料");
            } else {
                console.log("⚠️ 其他設備剛更新了資料，但您正在輸入，已暫停重整。");
            }
        }
    });
}

async function checkWritePermission() {
    if (!window.firebaseAPI) return false;
    const { doc, getDoc, db, authReady, getDeviceUID } = window.firebaseAPI;
    await authReady;
    const deviceUID = getDeviceUID();
    const empId = state.empId;

            if (deviceDoc.exists()) return true;
        } catch (e) { console.warn("檢查設備失敗:", e); }

    return false;
}

function isoDate(offsetDays){
  const d = new Date(Date.now() + offsetDays * 86400000);
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}


/* ============ 日期 / 狀態 ============ */
function daysLeft(expiry){
  if(!expiry || !/^\d{8}$/.test(expiry)) return null;
  const y = +expiry.slice(0,4), m = +expiry.slice(4,6), d = +expiry.slice(6,8);
  const t = new Date(y, m-1, d, 23, 59, 59).getTime();
  if(isNaN(t)) return null;
  return Math.ceil((t - Date.now()) / 86400000);
}
function itemStatus(page, item){
  if(!page) return 'normal';
  if(page.type === 'supplier' || page.type === 'consign') return 'normal';
  if(item.out) return 'red';
  if(item.noExpiry) return 'normal';
  const d = daysLeft(item.expiry);
  if(d === null) return 'normal';
  if(d < 30) return 'red';
  if(d < 90) return 'yellow';
  return 'normal';
}
function buildDateStr(y2, m, d){
  let yy = parseInt(y2, 10) || 0;
  let mm = parseInt(m, 10) || 1;
  let dd = parseInt(d, 10) || 0;
  if(mm < 1) mm = 1;
  if(mm > 12) mm = 12;
  const year = 2000 + yy;
  const last = new Date(year, mm, 0).getDate();
  if(dd < 1) dd = last;
  if(dd > last) dd = last;
  return `${year}${String(mm).padStart(2,'0')}${String(dd).padStart(2,'0')}`;
}

function normalizeDate8(raw){
  let s = String(raw ?? '').replace(/\D/g, '');
  if(!s) return '';
  if(s.length < 6) return '';
  if(s.length === 8){ /* ok */ }
  else if(s.length === 6){ s = '20' + s; }
  else { s = s.slice(0, 8).padEnd(8, '0'); }
  let y = +s.slice(0,4);
  let m = +s.slice(4,6);
  let d = +s.slice(6,8);
  if(!y || y < 2000 || y > 2099) return '';
  if(!m || m < 1) m = 1;
  if(m > 12) m = 12;
  const last = new Date(y, m, 0).getDate();
  if(!d || d < 1) d = last;
  if(d > last) d = last;
  return `${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;
}

function autoPromoteFromExtras(item){
  if(!item) return false;
  if(item.curQty > 0) return false;
  if(!Array.isArray(item.extras) || !item.extras.length) return false;

  const candidates = [];
  item.extras.forEach((ex, i) => {
    if((ex.qty || 0) > 0){
      candidates.push({
        idx: i,
        qty: ex.qty,
        expiry: ex.expiry || ''
      });
    }
  });
  if(!candidates.length) return false;

  candidates.sort((a, b) => {
    const da = a.expiry || '99999999';
    const db = b.expiry || '99999999';
    return da.localeCompare(db);
  });

  const pick = candidates[0];

  item.curQty = pick.qty;
  item.expiry = pick.expiry;
  item.noExpiry = false;  
  item.out = false;

  item.extras.splice(pick.idx, 1);

  return true;
}

function makeBarcode(text, h = 34){
  const vals = [];
  for(const ch of String(text)){
    const c = ch.charCodeAt(0);
    if(c < 32 || c > 126) continue;
    vals.push(c - 32);
  }
  if(!vals.length) return null;
  const START = 104;
  let sum = START;
  vals.forEach((v,i) => sum += v * (i + 1));
  const seq = [START, ...vals, sum % 103, 106];
  let pattern = '';
  seq.forEach(v => pattern += C128[v]);
  const total = [...pattern].reduce((a,c) => a + (+c), 0);
  const mw = Math.max(1, Math.min(1.8, 260 / total));
  const width = total * mw;
  let x = 0, bar = true, rects = '';
  for(const ch of pattern){
    const w = (+ch) * mw;
    if(bar) rects += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${h}" fill="#0f172a"/>`;
    x += w; bar = !bar;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${width.toFixed(1)}" height="${h}"
    viewBox="0 0 ${width.toFixed(1)} ${h}" preserveAspectRatio="xMinYMin meet">${rects}</svg>`;
}
function renderCodePreview(el, text){

  if(!text) return;
  if(state.codeMode === 'barcode'){
    const svg = makeBarcode(text);
    if(svg) el.innerHTML = svg; else el.textContent = text;
  }else{
    if(typeof qrcode === 'function'){
      try{
        const qr = qrcode(0, 'M');
        qr.addData(String(text));
        qr.make();
        el.innerHTML = qr.createSvgTag(2, 0);
        const s = el.querySelector('svg');
        if(s){ s.removeAttribute('width'); s.removeAttribute('height'); s.style.width = '52px'; s.style.height = '52px'; }
      }catch(err){ el.textContent = text; }
    }else el.textContent = text;
  }
}
const _codeTimers = {};
function schedulePreview(itemId, text){
  clearTimeout(_codeTimers[itemId]);
  _codeTimers[itemId] = setTimeout(() => {
    const el = document.querySelector(`[data-cprev="${itemId}"]`);
    renderCodePreview(el, text);

/* ============ 聯絡人工具 ============ */
function getAllContactsFull(){
  const list = [];
  state.pages.filter(p => p.type === 'supplier').forEach(p =>
    p.areas.forEach(a => a.items.forEach(it =>
      (it.contacts || []).forEach(c => {
        if(c.name && c.name.trim()){
          list.push({
            name: c.name.trim(),
            phone: c.phone || '',
            supplier: it.name || '',
            tags: Array.isArray(c.tags) ? c.tags : [],
          });
        }
      })
    ))
  );
  (state.customContacts || []).forEach(name => {
    const n = String(name || '').trim();
    if(n && !list.some(c => c.name === n)) list.push({ name:n, phone:'', supplier:'', tags:[] });
  });
  const seen = new Set();
  const out = [];
  list.forEach(c => {
    const k = `${c.name}||${c.supplier}`;
    if(seen.has(k)) return;
    seen.add(k);
    c.label = c.supplier ? `${c.name}（${c.supplier}）` : c.name;
    out.push(c);
  });
  return out.sort((a,b) =>
    a.name.localeCompare(b.name, 'zh-Hant') || a.supplier.localeCompare(b.supplier, 'zh-Hant')
  );
}
function parseContactLabel(label){
  if(!label) return { name:'', supplier:'' };
  const m = String(label).match(/^(.+?)（(.+?)）\s*$/);
  if(m) return { name:m[1].trim(), supplier:m[2].trim() };
  return { name:String(label).trim(), supplier:'' };
}
function lookupContact(label){
  if(!label) return { name:'—', phone:'—', supplier:'—', tags:[] };
  const parsed = parseContactLabel(label);
  const all = getAllContactsFull();
  let found = all.find(c => c.label === label);
  if(found){
    return { name: parsed.name || '—', phone: found.phone || '—',
             supplier: found.supplier || '—', tags: found.tags || [] };
  }
  if(parsed.name && parsed.supplier){
    found = all.find(c => c.name === parsed.name && c.supplier === parsed.supplier);
    if(found){
      return { name: parsed.name, phone: found.phone || '—',
               supplier: parsed.supplier || '—', tags: found.tags || [] };
    }
  }
  if(parsed.name){
    const candidates = all.filter(c => c.name === parsed.name);
    if(candidates.length){
      const withTags = candidates.find(c => (c.tags||[]).length) || candidates[0];
      return { name: parsed.name, phone: withTags.phone || '—',
               supplier: withTags.supplier || '—', tags: withTags.tags || [] };
    }
  }
  return { name: parsed.name || '—', phone: '—', supplier: parsed.supplier || '—', tags: [] };
}

let currentView = 'overview';
let searchQuery = '';
let lastRenderedView = null;

function render(){
  const content = $('#content');
  const viewChanged = (currentView !== lastRenderedView);
  const savedScroll = content ? content.scrollTop : 0;

  renderSidebar();
  renderContent();

/* ---- 側邊欄 ---- */
let dragIdx = null;
let pageNavTimer = null;

function renderSidebar(){
  const list = $('#pageList');
  let h = `<div class="nav-item ${currentView==='overview'?'active':''}" data-nav="overview">
      <span class="ic">📊</span><span class="nm">總覽</span></div>`;

  state.pages.forEach((p, i) => {
    h += `<div class="nav-item ${currentView===p.id?'active':''}" data-nav="${p.id}"
            draggable="true" data-idx="${i}">
      <span class="ic">${TYPES[p.type]?.icon || '📄'}</span>
      <span class="nm" data-rename="${p.id}" title="雙擊重新命名">${esc(p.name)}</span>
      <span class="dh">⋮⋮</span>
      <span class="del" data-delpage="${p.id}" title="刪除頁面">✕</span>
    </div>`;
  });

  list.innerHTML = h;

  list.onclick = e => {
    const delBtn = e.target.closest('[data-delpage]');
    if(delBtn){
      e.stopPropagation();
      const pid = delBtn.dataset.delpage;
      const p = getPage(pid);
      confirmBox(`確定刪除頁面「${p.name}」？此動作無法復原。`, () => {
        state.pages = state.pages.filter(x => x.id !== pid);
        if(currentView === pid) currentView = 'overview';
        saveState(); render();
        toast('頁面已刪除');
      });
      return;
    }
    const nav = e.target.closest('[data-nav]');
    if(!nav) return;

    const nm = e.target.closest('[data-rename]');
    if(nm){
      clearTimeout(pageNavTimer);
      pageNavTimer = setTimeout(() => {
        currentView = nav.dataset.nav;
        searchQuery = '';
        $('#search').value = '';
        render();
      }, 250);
      return;
    }

    clearTimeout(pageNavTimer);
    currentView = nav.dataset.nav;
    searchQuery = '';
    $('#search').value = '';
    render();
  };

  list.ondblclick = e => {
    const nm = e.target.closest('[data-rename]');
    if(!nm) return;
    clearTimeout(pageNavTimer);
    e.stopPropagation();
    const pid = nm.dataset.rename;
    const p = getPage(pid);
    if(!p) return;

    const input = document.createElement('input');
    input.className = 'ren';
    input.value = p.name;
    nm.replaceWith(input);
    input.focus(); input.select();

    let committed = false;
    const commit = () => {
      if(committed) return;
      committed = true;
      const v = input.value.trim();
      if(v && v !== p.name){
        p.name = v;
        saveState();
        toast('已重新命名：' + v);
      }
      render();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', ev => {
      if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); }
      if(ev.key === 'Escape'){ ev.preventDefault(); input.value = p.name; input.blur(); }
    });
  };

  list.addEventListener('contextmenu', e => {
    const nm = e.target.closest('[data-rename]');
    if(!nm) return;
    e.preventDefault();
    const pid = nm.dataset.rename;
    const p = getPage(pid);
    if(!p) return;

    ctx.innerHTML = `<div class="ctx-t">頁面操作</div>
      <div class="ctx-i" data-ctx-prn>✏️ 重新命名</div>
      <div class="ctx-i" data-ctx-pdel style="color:#e5484d">🗑 刪除此頁面</div>`;
    ctx.style.display = 'block';
    ctx.style.left = Math.min(e.clientX, innerWidth - 200) + 'px';
    ctx.style.top  = Math.min(e.clientY, innerHeight - 100) + 'px';
    ctx.onclick = ev => {
      if(ev.target.closest('[data-ctx-prn]')){
        closeCtx();
        const nmEl = document.querySelector(`[data-rename="${pid}"]`);
        if(!nmEl) return;
        const input = document.createElement('input');
        input.className = 'ren';
        input.value = p.name;
        nmEl.replaceWith(input);
        input.focus(); input.select();
        let committed = false;
        const commit = () => {
          if(committed) return;
          committed = true;
          const v = input.value.trim();
          if(v && v !== p.name){ p.name = v; saveState(); toast('已重新命名：' + v); }
          render();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', ev2 => {
          if(ev2.key === 'Enter'){ ev2.preventDefault(); input.blur(); }
          if(ev2.key === 'Escape'){ ev2.preventDefault(); input.value = p.name; input.blur(); }
        });
      }
      if(ev.target.closest('[data-ctx-pdel]')){
        closeCtx();
        confirmBox(`確定刪除頁面「${p.name}」？`, () => {
          state.pages = state.pages.filter(x => x.id !== pid);
          if(currentView === pid) currentView = 'overview';
          saveState(); render();
          toast('頁面已刪除');
        });
      }
    };
  });

  list.addEventListener('dragstart', e => {
    const it = e.target.closest('[data-idx]');
    if(!it) return;
    dragIdx = +it.dataset.idx;
    it.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const it = e.target.closest('[data-idx]');
    $$('.nav-item.drop-target').forEach(n => n.classList.remove('drop-target'));
    if(it) it.classList.add('drop-target');
  });
  list.addEventListener('dragleave', e => {
    const it = e.target.closest('[data-idx]');
    if(it) it.classList.remove('drop-target');
  });
  list.addEventListener('drop', e => {
    e.preventDefault();
    const it = e.target.closest('[data-idx]');
    $$('.nav-item').forEach(n => n.classList.remove('drop-target','dragging'));
    if(!it || dragIdx === null) return;
    const to = +it.dataset.idx;
    if(to === dragIdx){ dragIdx = null; return; }
    const [moved] = state.pages.splice(dragIdx, 1);
    state.pages.splice(to, 0, moved);
    dragIdx = null;
    saveState(); renderSidebar();
  });
  list.addEventListener('dragend', () => {
    dragIdx = null;
    $$('.nav-item').forEach(n => n.classList.remove('drop-target','dragging'));
  });
}

/* ============ 物品編號重複檢測 ============ */
function normCode(c){ return String(c ?? '').trim().toUpperCase(); }

function findDuplicateCodes(code, excludePid, excludeAid, excludeIid){
  const norm = normCode(code);
  if(!norm) return [];
  const out = [];
  state.pages.forEach(p => {
    if(p.type === 'supplier') return;
    p.areas.forEach(a => a.items.forEach(it => {
      if(p.id === excludePid && a.id === excludeAid && it.id === excludeIid) return;
      if(normCode(it.code) === norm){
        out.push({
          pid: p.id, pageName: p.name,
          aid: a.id, areaName: a.name,
          iid: it.id, itemName: it.name || '(未命名)',
        });
      }
    }));
  });
  return out;
}

function updateDupWarning(inputEl){
  const row = inputEl.closest('[data-iid]');
  if(!row) return;
  const p = getPage(row.dataset.pid);
  const a = getArea(p, row.dataset.aid);
  const it = getItem(p, row.dataset.aid, row.dataset.iid);
  if(!it) return;

  const wrap = inputEl.closest('.code-wrap');
  if(!wrap) return;
  let warn = wrap.querySelector('.code-warn');

  const dups = findDuplicateCodes(inputEl.value, p.id, a.id, it.id);

  if(dups.length){
    inputEl.classList.add('dup');
    if(!warn){
      warn = document.createElement('div');
      warn.className = 'code-warn';
      wrap.appendChild(warn);
    }
    const names = dups.slice(0, 2).map(d => `${d.pageName} / ${d.areaName}`).join('、');
    warn.textContent = `⚠ 編號重複：${names}${dups.length > 2 ? ` 等 ${dups.length} 處` : ''}`;
  }else{
    inputEl.classList.remove('dup');
    if(warn) warn.remove();
  }
  setTimeout(updateStickyHeights, 0);
}

function refreshDuplicatesFor(code){
  const norm = normCode(code);
  $$('.row[data-iid]').forEach(row => {
    const inputEl = row.querySelector('input[data-f="code"]');
    if(!inputEl) return;
    if(normCode(inputEl.value) === norm){
      updateDupWarning(inputEl);
    }
  });
}

function scanAllDuplicates(){
  const codeMap = new Map();
  $$('.row[data-iid]').forEach(row => {
    const inputEl = row.querySelector('input[data-f="code"]');
    if(!inputEl) return;
    const norm = normCode(inputEl.value);
    if(!norm) return;
    if(!codeMap.has(norm)) codeMap.set(norm, []);
    codeMap.get(norm).push({ inputEl });
  });
  codeMap.forEach(list => {
    if(list.length > 1){
      list.forEach(o => updateDupWarning(o.inputEl));
    }
  });
}

/* ============ 現存量欄 & 有效日期欄 逐列對齊 ============ */
function alignQtyExpiryRows(){
  $$('.row[data-iid]').forEach(row => {
    const qtyCell = row.querySelector('[data-col="curQty"]');
    const expCell = row.querySelector('[data-col="expiry"]');
    if(!qtyCell || !expCell) return;

    const qtyRows = qtyCell.querySelectorAll('.qty-main-row, .qty-extra-row');
    const expRows = expCell.querySelectorAll('.expiry-main-row, .expiry-extra-row');

    qtyRows.forEach(r => { r.style.height = ''; });
    expRows.forEach(r => { r.style.height = ''; });

    const len = Math.min(qtyRows.length, expRows.length);
    for(let i = 0; i < len; i++){
      const qr = qtyRows[i], er = expRows[i];
      const maxH = Math.max(qr.offsetHeight, er.offsetHeight);
      qr.style.height = maxH + 'px';
      er.style.height = maxH + 'px';
    }
  });
}

/* ============ 供應商三欄列高對齊 ============ */
function alignSupplierRows(){
  $$('.row[data-iid]').forEach(row => {
    const nameCell  = row.querySelector('[data-col="cname"]');
    const phoneCell = row.querySelector('[data-col="cphone"]');
    const tagCell   = row.querySelector('[data-col="tags"]');
    if(!nameCell || !phoneCell || !tagCell) return;

    const nameBlocks  = nameCell.querySelectorAll('.contact-block');
    const phoneBlocks = phoneCell.querySelectorAll('.phone-block');
    const tagBlocks   = tagCell.querySelectorAll('.ct-tags-block');

    const len = nameBlocks.length;
    for(let i = 0; i < len; i++){
      const trio = [nameBlocks[i], phoneBlocks[i], tagBlocks[i]];
      trio.forEach(b => { if(b) b.style.height = ''; });
      const maxH = Math.max(0, ...trio.map(b => b ? b.offsetHeight : 0));
      trio.forEach(b => { if(b) b.style.height = maxH + 'px'; });
    }
  });
}

let _ro = null, _roTimer = null;
function setupSupplierObserver(){
  if(_ro) _ro.disconnect();
  if(typeof ResizeObserver === 'undefined') return;
  _ro = new ResizeObserver(() => {
    clearTimeout(_roTimer);
    _roTimer = setTimeout(alignSupplierRows, 30);
  });
  $$('[data-col="tags"] .ct-tags-block').forEach(el => _ro.observe(el));
  $$('[data-col="cname"] .contact-block').forEach(el => _ro.observe(el));
}

  })));

    total++;

    if(st === 'yellow') yellows++;

  let h = `<div class="page-head"><h2>總覽</h2>
      <span class="pill">工號 ${esc(state.empId)}</span>

                     .sort((a,b) => {
                       const da = daysLeft(a.item.expiry) ?? 99999;

                       return da - db;
                     });

  if(alerts.length){
    h += `<div class="area">
      <div class="area-head"><span class="area-dot" style="background:#e5484d"></span>

        <div class="cell hcell" style="width:180px">物品名稱</div>

        <div class="cell hcell" style="width:90px">剩餘天數</div>

        <div class="cell" style="width:110px">${esc(r.area.name)}</div>

        <div class="cell" style="width:110px">${esc(r.item.noExpiry ? '不過期' : (r.item.expiry || '—'))}</div>

      </div>`;
    });
    h += `</div>`;
  }

  if(state.pages.length){
    h += `<div class="sec-title" style="margin-top:20px">各倉庫摘要</div>`;
    h += `<div class="stats">`;
    state.pages.forEach(p => {
      const n = p.areas.reduce((s,a) => s + a.items.length, 0);
      h += `<div class="stat" style="cursor:pointer" data-goto="${p.id}">

  }

  if(!recs.length) h += `<div class="empty">尚未有任何資料。點擊左側「＋ 新增頁面」開始建立倉庫。</div>`;
  return h;
}

/* ============ 頁面 ============ */
function cellHTML(key, width, inner, type){
  return `<div class="cell" data-col="${key}" data-type="${type}" style="width:${width}px;min-width:${width}px">${inner}</div>`;
}
function notesHTML(item){
  const notes = item.notes || [];
  let h = `<div class="notes">`;
  notes.forEach((n, i) => {
    h += `<div class="note-line">
      <input class="inp" data-f="note" data-ni="${i}" value="${esc(n)}" placeholder="備注">
      <button class="mini" data-act="delnote" data-ni="${i}" title="刪除此備注">✕</button>
    </div>`;
  });
  h += `<div class="note-line"><button class="mini add" data-act="addnote">＋ 備注</button></div></div>`;
  return h;
}

function qtyCellHTML(item){
  let h = `<div class="qty-wrap">
    <div class="qty-main-row">
      <input class="inp num" type="text" inputmode="numeric"
        data-f="curQty" data-num="1" value="${item.curQty ?? 0}">
      <button class="add-extra-btn" data-act="add-extra" title="新增一列數量">+</button>
    </div>`;

  const extras = Array.isArray(item.extras) ? item.extras : [];
  extras.forEach((ex, i) => {
    h += `<div class="qty-extra-row" data-ei="${i}">
      <input class="inp num extra-qty" type="text" inputmode="numeric"
        data-f="extra-qty" data-ei="${i}" data-num="1"
        value="${ex.qty ?? 0}" placeholder="數量" title="追加數量">
      <button class="mini" data-act="del-extra" data-ei="${i}" title="刪除此列">✕</button>
    </div>`;
  });

  h += `</div>`;
  return h;
}

function expiryCellHTML(item){
  const noExp = !!item.noExpiry;
  const extras = Array.isArray(item.extras) ? item.extras : [];

  let h = `<div class="expiry-wrap">`;

  if(noExp){
    h += `<div class="expiry-main-row">
      <div class="no-expiry-label" data-act="toggle-no-expiry" title="點擊恢復有效日期">✓ 不過期</div>
    </div>`;
  }else{
    h += `<div class="expiry-main-row">
      <input class="inp exp-inp" data-f="expiry" value="${esc(item.expiry||'')}"
        placeholder="YYYYMMDD" maxlength="8" inputmode="numeric">
    </div>`;

    extras.forEach((ex, i) => {
      h += `<div class="expiry-extra-row" data-ei="${i}">
        <input class="inp extra-exp" type="text" inputmode="numeric" maxlength="8"
          data-f="extra-expiry" data-ei="${i}"
          value="${esc(ex.expiry || '')}" placeholder="YYYYMMDD" title="追加有效日期">
      </div>`;
    });

    h += `<button class="no-expiry-btn" data-act="toggle-no-expiry" title="設為不過期">不過期</button>`;
  }

  h += `</div>`;
  return h;
}

function rowHTML(page, area, item){
  const type = page.type;
  const w = getWidths(type);
  const st = itemStatus(page, item);
  const attrs = `data-pid="${page.id}" data-aid="${area.id}" data-iid="${item.id}"`;
  let cells = '';

  if(type === 'common' || type === 'special'){
    cells += cellHTML('code', w.code,
      `<div style="display:flex;gap:5px;align-items:flex-start">
        <span class="item-drag-handle" draggable="true" title="拖動排序物品">⋮⋮</span>
        <div class="code-wrap" style="flex:1;min-width:0">
          <input class="inp" data-f="code" value="${esc(item.code||'')}" placeholder="物品編號">
          <div class="cprev" data-cprev="${item.id}"></div>
        </div>
      </div>`, type);

    cells += cellHTML('name', w.name,
      `<textarea class="inp name-area" data-f="name" data-tip="1" data-ctxcontact="1" rows="1"
        placeholder="物品名稱">${esc(item.name||'')}</textarea>`, type);

    cells += cellHTML('note', w.note, notesHTML(item), type);

    cells += cellHTML('baseQty', w.baseQty,
      `<input class="inp num" type="text" inputmode="numeric"
        data-f="baseQty" data-num="1" value="${item.baseQty ?? 0}">`, type);

    cells += cellHTML('curQty', w.curQty, qtyCellHTML(item), type);

    cells += cellHTML('out', w.out,
      `<button class="out-btn ${item.out?'on':''}" data-act="toggle-out">${item.out?'缺貨':'正常'}</button>`, type);

    cells += cellHTML('expiry', w.expiry, expiryCellHTML(item), type);

    cells += cellHTML('act', w.act,
      `<button class="icon-btn" data-act="del-item" title="刪除物品">✕</button>`, type);
  }

  else if(type === 'consign'){
    cells += cellHTML('code', w.code,
      `<div style="display:flex;gap:5px;align-items:flex-start">
        <span class="item-drag-handle" draggable="true" title="拖動排序物品">⋮⋮</span>
        <div class="code-wrap" style="flex:1;min-width:0">
          <input class="inp" data-f="code" value="${esc(item.code||'')}" placeholder="物品編號">
          <div class="cprev" data-cprev="${item.id}"></div>
        </div>
      </div>`, type);

    cells += cellHTML('name', w.name,
      `<textarea class="inp name-area" data-f="name" data-tip="1" rows="1"
        placeholder="物品名稱">${esc(item.name||'')}</textarea>`, type);

    cells += cellHTML('note', w.note, notesHTML(item), type);

    const contacts = getAllContactsFull();
    let opts = ['<option value="">— 選擇聯絡人員 —</option>'];
    contacts.forEach(c => {
      const tags = (c.tags && c.tags.length) ? ` [${c.tags.join('·')}]` : '';
      opts.push(`<option value="${esc(c.label)}" ${item.contact===c.label?'selected':''}>${esc(c.label)}${esc(tags)}</option>`);
    });
    if(item.contact && !contacts.some(c => c.label === item.contact)){
      opts.push(`<option value="${esc(item.contact)}" selected>${esc(item.contact)}</option>`);
    }
    opts.push(`<option value="__new__">＋ 新增聯絡人員…</option>`);
    cells += cellHTML('contact', w.contact,
      `<select class="inp" data-f="contact" style="cursor:pointer">${opts.join('')}</select>`, type);

    cells += cellHTML('act', w.act,
      `<button class="icon-btn" data-act="del-item" title="刪除物品">✕</button>`, type);
  }

  else if(type === 'supplier'){
    const contacts = item.contacts || [];

    cells += cellHTML('name', w.name,
      `<div style="display:flex;gap:6px;align-items:center">
        <span class="supplier-drag-handle" draggable="true" title="拖動調整供應商順序">⋮⋮</span>
        <input class="inp" data-f="s-name" value="${esc(item.name||'')}" placeholder="供應商名稱">
      </div>`, type);

    let nHtml = `<div class="contacts-list">`;
    contacts.forEach((c, i) => {
      nHtml += `<div class="contact-block" data-ci="${i}">
        <div class="contact-head">
          <span class="contact-drag-handle" draggable="true" title="拖動調整聯絡人順序">⋮⋮</span>
          <input class="inp" data-f="c-name" data-ci="${i}" value="${esc(c.name||'')}" placeholder="聯絡人">
        </div>
      </div>`;
    });
    nHtml += `<div class="add-row"><button class="mini add" data-act="addcontact">＋ 聯絡人</button></div>`;
    nHtml += `</div>`;
    cells += cellHTML('cname', w.cname, nHtml, type);

    let pHtml = `<div class="phone-list">`;
    contacts.forEach((c, i) => {
      pHtml += `<div class="phone-block" data-ci="${i}">
        <input class="inp" data-f="c-phone" data-ci="${i}" value="${esc(c.phone||'')}" placeholder="電話">
        <button class="mini" data-act="delcontact" data-ci="${i}" title="刪除">✕</button>
      </div>`;
    });
    pHtml += `<div class="add-row-placeholder"></div></div>`;
    cells += cellHTML('cphone', w.cphone, pHtml, type);

    let tHtml = `<div class="ct-tags-list">`;
    contacts.forEach((c, i) => {
      const tags = Array.isArray(c.tags) ? c.tags : [];
      tHtml += `<div class="ct-tags-block" data-ct-ci="${i}">
        <div class="ct-tag-list">
          ${tags.map((t, ti) =>
            `<span class="tag-mini">${esc(t)}<b data-act="delctag" data-ci="${i}" data-ti="${ti}">✕</b></span>`
          ).join('')}
          <input class="tag-add" data-f="ctag-input" data-ci="${i}" placeholder="+標籤" maxlength="20">
        </div>
      </div>`;
    });
    tHtml += `<div class="add-row-placeholder"></div></div>`;
    cells += cellHTML('tags', w.tags, tHtml, type);

    cells += cellHTML('act', w.act,
      `<button class="icon-btn" data-act="del-item" title="刪除供應商">✕</button>`, type);
  }

  return `<div class="row ${st !== 'normal' ? st : ''}" ${attrs}>${cells}</div>`;
}

function viewPage(page){
  const cols = COLS[page.type];
  const w = getWidths(page.type);

  const isConsign  = page.type === 'consign';
  const addLabel = isSupplier ? '＋ 供應商' : (isConsign ? '＋ 寄沽物品' : '＋ 物品');

  let h = `<div class="page-head">
    <h2>${esc(page.name)}</h2>
    <span class="pill">${TYPES[page.type].icon} ${TYPES[page.type].label}</span>

    <button class="btn" data-act="collapse-all">折疊全部</button>

    <button class="btn" data-act="export-page">⬇ 匯出本頁</button>
    <button class="btn" data-act="toggle-code">
      ${state.codeMode === 'qrcode' ? '二維碼 ✓' : '一維碼 ✓'}
    </button>
  </div>`;

  if(!page.areas.length){
    h += `<div class="empty">此頁面尚無區域，點擊「＋ 新增區域」開始建立。</div>`;
    return h;
  }

  page.areas.forEach(area => {
    const collapsedCls = area.collapsed ? ' collapsed' : '';
    h += `<div class="area${collapsedCls}" data-aid="${area.id}">
      <div class="area-head" title="點擊空白處折疊 / 展開">
        <span class="area-drag-handle" draggable="true" title="拖動排序區域">⋮⋮</span>
        <button class="collapse-toggle" data-act="toggle-area" title="折疊 / 展開">▼</button>
        <span class="area-dot"></span>
        <input class="area-name" data-f="area-name" value="${esc(area.name)}">
        <span class="count">${area.items.length} 項</span>
        <div class="grow"></div>
        <button class="btn sm" data-act="add-item">${addLabel}</button>
        <button class="btn sm danger" data-act="del-area">刪除區域</button>
      </div>`;

    h += `<div class="hrow">`;
    cols.forEach(c => {
      h += `<div class="cell hcell" data-col="${c.k}" data-type="${page.type}"
              style="width:${w[c.k]}px;min-width:${w[c.k]}px">
        ${esc(c.t)}<span class="rz" data-col="${c.k}" data-type="${page.type}"></span>
      </div>`;
    });
    h += `</div>`;

    area.items.forEach(it => { h += rowHTML(page, area, it); });
    h += `</div>`;
  });

  return h;
}

/* ============ 搜索 ============ */
function viewSearch(){
  const q = searchQuery.toLowerCase();
  const recs = getAllRecords().filter(r => {
    const p = r.page, it = r.item;
    if(p.type === 'supplier'){
      const hay = [it.name,
        ...(it.contacts||[]).map(c => [c.name, c.phone, ...(c.tags||[])].join(' ')),
      ].join(' ').toLowerCase();
      return hay.includes(q);
    }
    if(p.type === 'common' || p.type === 'special'){
      const hay = [it.code, it.name, (it.contactList||[]).join(' '), ...(it.notes||[])].join(' ').toLowerCase();
      return hay.includes(q);
    }
    const hay = [it.code, it.name, it.contact, ...(it.notes||[])].join(' ').toLowerCase();
    return hay.includes(q);
  });

  let h = `<div class="page-head"><h2>搜索結果</h2>
    <span class="pill">「${esc(searchQuery)}」</span>
    <span class="count">${recs.length} 項</span></div>`;

  if(!recs.length) return h + `<div class="empty">找不到符合「${esc(searchQuery)}」的資料。</div>`;

  h += `<div class="area">
    <div class="hrow">
      <div class="cell hcell" style="width:130px">倉庫</div>
      <div class="cell hcell" style="width:110px">區域</div>
      <div class="cell hcell" style="width:150px">編號 / 供應商</div>
      <div class="cell hcell" style="width:180px">名稱 / 聯絡人</div>
      <div class="cell hcell" style="width:90px">現存量</div>
      <div class="cell hcell" style="width:110px">有效日期</div>
      <div class="cell hcell" style="flex:1">備注 / 標籤</div>
    </div>`;
  recs.forEach(r => {
    const { page, area, item } = r;
    const st = itemStatus(page, item);
    const isSup = page.type === 'supplier';
    const isComSp = (page.type === 'common' || page.type === 'special');
    const code = isSup ? (item.name || '') : (item.code || '');
    const name = isSup
      ? (item.contacts || []).map(c => c.name).filter(Boolean).join('、')
      : (item.name || '');
    const extra = isSup
      ? (item.contacts||[]).flatMap(c => c.tags || []).join('、')
      : (item.notes || []).filter(Boolean).join('；');
    const contactInfo = isComSp ? (item.contactList || []).join('、') : '';
    h += `<div class="row ${st !== 'normal' ? st : ''}">
      <div class="cell" style="width:130px">${esc(page.name)}</div>
      <div class="cell" style="width:110px">${esc(area.name)}</div>
      <div class="cell" style="width:150px">${esc(code)}</div>
      <div class="cell" style="width:180px;word-break:break-word">${esc(name)}${contactInfo ? `<div style="color:#7a8395;font-size:.72rem">${esc(contactInfo)}</div>` : ''}</div>
      <div class="cell" style="width:90px">${isSup ? '—' : (item.out ? '<b style="color:#e5484d">缺貨</b>' : (item.curQty ?? '—'))}</div>
      <div class="cell" style="width:110px">${esc(isSup ? '—' : (item.noExpiry ? '不過期' : (item.expiry || '—')))}</div>
      <div class="cell" style="flex:1;word-break:break-word">${esc(extra)}</div>
    </div>`;
  });
  return h + `</div>`;
}

/* ============ 缺貨 / 現存量 連動 ============ */
function syncOutBtn(row, item){
  const btn = row.querySelector('[data-act="toggle-out"]');
  if(btn){ btn.classList.toggle('on', !!item.out); btn.textContent = item.out ? '缺貨' : '正常'; }
}
function syncQtyInput(row, item){
  const q = row.querySelector('[data-f="curQty"]');
  if(q && document.activeElement !== q) q.value = item.curQty ?? 0;
}
function updateRowStatus(row){
  const p = getPage(row.dataset.pid);
  const it = getItem(p, row.dataset.aid, row.dataset.iid);
  if(!it) return;
  row.classList.remove('red', 'yellow');
  const st = itemStatus(p, it);
  if(st !== 'normal') row.classList.add(st);
}
function parseNonNegInt(raw){
  const s = String(raw ?? '').trim();
  if(s === '') return null;
  const cleaned = s.replace(/[^\d]/g, '');
  if(cleaned === '') return null;
  const n = parseInt(cleaned, 10);
  if(isNaN(n) || n < 0) return 0;
  return n;
}

function toggleAreaCollapse(areaEl, pageEl){
  if(!areaEl || !pageEl) return;
  const p = getPage(pageEl.dataset.pageid);
  const a = getArea(p, areaEl.dataset.aid);
  if(!a) return;
  a.collapsed = !a.collapsed;
  saveState();
  areaEl.classList.toggle('collapsed', a.collapsed);

  if(!a.collapsed){
    requestAnimationFrame(() => {
      areaEl.querySelectorAll('.name-area').forEach(el => autoResize(el));
      alignQtyExpiryRows();
      updateStickyHeights();
    });
  }else{
    setTimeout(updateStickyHeights, 0);
  }
}

function addItemToAreaLocal(page, area){
  const newIt = newItem(page.type);
  area.items.push(newIt);
  saveState();

  const pageEl = document.querySelector(`[data-pageid="${page.id}"]`);
  if(!pageEl){ render(); return; }
  const areaEl = pageEl.querySelector(`.area[data-aid="${area.id}"]`);
  if(!areaEl){ render(); return; }

  if(area.collapsed){
    area.collapsed = false;
    areaEl.classList.remove('collapsed');
    saveState();
  }

  const countEl = areaEl.querySelector('.count');
  if(countEl) countEl.textContent = `${area.items.length} 項`;

  const newRowHTML = rowHTML(page, area, newIt);
  const temp = document.createElement('div');
  temp.innerHTML = newRowHTML;
  const newRow = temp.firstElementChild;

  const rows = areaEl.querySelectorAll('.row');
  if(rows.length){
    rows[rows.length-1].insertAdjacentElement('afterend', newRow);
  }else{
    const hrow = areaEl.querySelector('.hrow');
    if(hrow) hrow.insertAdjacentElement('afterend', newRow);
    else areaEl.appendChild(newRow);
  }

  if(newIt.code){
    const cprev = newRow.querySelector('.cprev');
    if(cprev) renderCodePreview(cprev, newIt.code);
  }

  requestAnimationFrame(() => {
    alignQtyExpiryRows();
    updateStickyHeights();

    try{
      const content = $('#content');
      const rowRect = newRow.getBoundingClientRect();
      const cRect = content.getBoundingClientRect();
      const pageHeadEl = content.querySelector('.page-head');
      const pageHeadH = pageHeadEl ? pageHeadEl.getBoundingClientRect().height : 0;
      const topBound = cRect.top + pageHeadH + 10;
      const bottomBound = cRect.bottom - 10;

      if(rowRect.bottom > bottomBound){
        content.scrollTop += (rowRect.bottom - bottomBound);
      }else if(rowRect.top < topBound){
        content.scrollTop -= (topBound - rowRect.top);
      }
    }catch(e){}

    const codeInput = newRow.querySelector('input[data-f="code"]');
    if(codeInput){
      codeInput.focus();
      try{ codeInput.select(); }catch(_){}
    }
  });
}

function rebuildQtyCell(row, item){
  const cell = row.querySelector('[data-col="curQty"]');
  if(!cell) return;
  cell.innerHTML = qtyCellHTML(item);
  setTimeout(() => { alignQtyExpiryRows(); updateStickyHeights(); }, 20);
}

function rebuildExpiryCell(row, item){
  const cell = row.querySelector('[data-col="expiry"]');
  if(!cell) return;
  cell.innerHTML = expiryCellHTML(item);
  setTimeout(() => { alignQtyExpiryRows(); updateStickyHeights(); }, 20);
}

/* ============ 點擊全選 / 雙擊複製 ============ */
document.addEventListener('mousedown', e => {
  const el = e.target.closest('input[data-f="code"], input[data-f="area-name"]');
  if(!el) return;
  if(document.activeElement !== el){
    e.preventDefault();
    el.focus();
    try{ el.select(); }catch(_){}
  }
});

document.addEventListener('dblclick', e => {
  const el = e.target.closest('input[data-f="code"]');
  if(!el) return;
  const val = (el.value || '').trim();
  if(!val) return;
  e.preventDefault();
  copyToClipboard(val).then(() => {
    toast('已複製編號：' + val);
  }).catch(() => {
    toast('複製失敗');
  });
});

/* ============ 輸入事件 ============ */
document.addEventListener('input', e => {
  const el = e.target;
  const f  = el.dataset.f;
  if(!f) return;

  if(f === 'area-name'){
    const areaEl = el.closest('[data-aid]');
    const pageEl = el.closest('[data-pageid]');
    if(!pageEl) return;
    const p = getPage(pageEl.dataset.pageid);
    const a = getArea(p, areaEl.dataset.aid);
    if(a){ a.name = el.value; saveState(); }
    return;
  }
  if(f === 'ctag-input') return;

  const row = el.closest('[data-iid]');
  if(!row) return;
  const p = getPage(row.dataset.pid);
  const it = getItem(p, row.dataset.aid, row.dataset.iid);
  if(!it) return;

  switch(f){
    case 'code': {
      const oldCode = it.code;
      it.code = el.value;
      schedulePreview(it.id, el.value);
      refreshDuplicatesFor(oldCode);
      refreshDuplicatesFor(el.value);
      break;
    }
    case 'name':
      it.name = el.value;
      if(el.classList.contains('name-area')) autoResize(el);
      break;
    case 'baseQty': {
      const filtered = String(el.value).replace(/[^\d]/g, '');
      if(filtered !== el.value){
        const pos = el.selectionStart;
        el.value = filtered;
        try { el.setSelectionRange(pos, pos); } catch(_){}
      }
      const n = parseNonNegInt(filtered);
      if(n !== null){ it.baseQty = n; saveState(); }
      break;
    }
    case 'curQty': {
      const filtered = String(el.value).replace(/[^\d]/g, '');
      if(filtered !== el.value){
        const pos = el.selectionStart;
        el.value = filtered;
        try { el.setSelectionRange(pos, pos); } catch(_){}
      }
      const n = parseNonNegInt(filtered);
      if(n !== null){ it.curQty = n; saveState(); }
      break;
    }
    case 'extra-qty': {
      const ei = +el.dataset.ei;
      if(!Array.isArray(it.extras) || !it.extras[ei]) break;
      const filtered = String(el.value).replace(/[^\d]/g, '');
      if(filtered !== el.value){
        const pos = el.selectionStart;
        el.value = filtered;
        try { el.setSelectionRange(pos, pos); } catch(_){}
      }
      const n = parseNonNegInt(filtered);
      if(n !== null){ it.extras[ei].qty = n; saveState(); }
      break;
    }
    case 'extra-expiry': {
      const ei = +el.dataset.ei;
      if(!Array.isArray(it.extras) || !it.extras[ei]) break;
      let v = String(el.value).replace(/\D/g, '').slice(0, 8);
      if(v !== el.value) el.value = v;
      it.extras[ei].expiry = v;
      saveState();
      break;
    }
    case 'note': it.notes[+el.dataset.ni] = el.value; break;
    case 's-name': it.name = el.value; break;
    case 'c-name': {
      const ci = +el.dataset.ci;
      if(it.contacts[ci]) it.contacts[ci].name = el.value;
      break;
    }
    case 'c-phone':
      if(it.contacts[+el.dataset.ci]) it.contacts[+el.dataset.ci].phone = el.value;
      break;
  }
  saveState();
});

/* ============ 有效日期 ============ */
function getExpiryState(input){
  if(!input._exp){
    const v = input.value;
    if(v && /^\d{8}$/.test(v)) input._exp = { y: v.slice(2,4), m: v.slice(4,6), d: v.slice(6,8), stage:'done' };
    else input._exp = { y:'', m:'', d:'', stage:'y' };
  }
  return input._exp;
}
function renderExpiry(input, st){
  let v = '';
  if(st.y){
    v += '20' + st.y.padStart(2, '0');
    if(st.m){ v += st.m; if(st.d) v += st.d; }
  }
  input.value = v;
}
function syncExpiryToItem(input){
  const row = input.closest('[data-iid]');
  if(!row) return;
  const p = getPage(row.dataset.pid);
  const it = getItem(p, row.dataset.aid, row.dataset.iid);
  if(!it) return;
  const st = input._exp;
  if(!st || !st.y || st.y.length < 2) it.expiry = '';
  else if(!st.m) it.expiry = '';
  else it.expiry = buildDateStr(st.y, st.m, st.d || '0');
  saveState();
  updateRowStatus(row);
}

document.addEventListener('keydown', e => {
  const el = e.target;

  if(e.key === 'Escape'){
    const bg = document.querySelector('.modal-bg');
    if(bg){ closeModal(); return; }
    if($('#ctxmenu').style.display === 'block'){ closeCtx(); return; }
  }

  if(e.key === 'Enter'){
    const bg = document.querySelector('.modal-bg');
    if(bg){
      const ok = bg.querySelector('[data-m="ok"]');
      if(ok && el.tagName !== 'TEXTAREA'){ e.preventDefault(); ok.click(); return; }
    }
  }

  if(el.dataset && el.dataset.num === '1'){
    if(['-','.','e','E','+'].includes(e.key)){ e.preventDefault(); return; }
  }

  if(el.dataset && (el.dataset.f === 'extra-expiry' || el.dataset.f === 'extra-qty')){
    if(e.key === 'Enter'){ e.preventDefault(); el.blur(); return; }
  }

  if(e.key === 'Enter' && !e.shiftKey && el.classList && el.classList.contains('name-area')){
    e.preventDefault(); el.blur();
    const row = el.closest('[data-iid]');
    let next = row.nextElementSibling;
    while(next && !next.classList.contains('row')) next = next.nextElementSibling;
    if(next){ const nx = next.querySelector('[data-f="name"]'); if(nx){ nx.focus(); nx.select(); } }
    return;
  }

  if(el.dataset && el.dataset.f === 'expiry'){
    const st = getExpiryState(el);
    if(e.key === 'Enter'){
      e.preventDefault(); finalizeExpiry(el, st);
      const row = el.closest('[data-iid]');
      let probe = row.nextElementSibling;
      while(probe && !probe.classList.contains('row')) probe = probe.nextElementSibling;
      let nx = null;
      while(probe && !nx){
        nx = probe.querySelector('input[data-f="expiry"]');
        if(!nx){
          probe = probe.nextElementSibling;
          while(probe && !probe.classList.contains('row')) probe = probe.nextElementSibling;
        }
      }
      if(nx){ nx.focus(); nx.select(); }
      return;
    }
    if(e.key === 'Backspace'){
      e.preventDefault();
      if(st.d) st.d = st.d.slice(0, -1);
      else if(st.m) st.m = st.m.slice(0, -1);
      else if(st.y) st.y = st.y.slice(0, -1);
      if(st.d) st.stage = 'd'; else if(st.m) st.stage = 'm'; else st.stage = 'y';
      renderExpiry(el, st); syncExpiryToItem(el);
      return;
    }
    if(!/^\d$/.test(e.key)) return;
    e.preventDefault();
    if(st.stage === 'done'){ st.y = ''; st.m = ''; st.d = ''; st.stage = 'y'; }
    const k = e.key;
    if(st.stage === 'y'){
      st.y += k;
      if(st.y.length >= 2){ st.y = st.y.slice(0, 2); st.stage = 'm'; }
    }else if(st.stage === 'm'){
      if(st.m.length === 0){
        if(k === '0' || k === '1'){ st.m = k; }
        else{ st.m = '0' + k; st.stage = 'd'; }
      }else{
        st.m += k;
        let mv = parseInt(st.m, 10);
        if(isNaN(mv) || mv < 1) mv = 1;
        if(mv > 12) mv = 12;
        st.m = String(mv).padStart(2, '0');
        st.stage = 'd';
      }
    }else if(st.stage === 'd'){
      if(st.d.length === 0){
        if(k >= '4'){ st.d = k; st.stage = 'done'; }
        else{ st.d = k; }
      }else{
        st.d += k; st.d = st.d.slice(0, 2); st.stage = 'done';
      }
    }
    renderExpiry(el, st); syncExpiryToItem(el);
    return;
  }

  if(e.key === 'Enter' && el.dataset && el.dataset.f === 'ctag-input'){
    e.preventDefault();
    const row = el.closest('[data-iid]');
    const ci = +el.dataset.ci;
    const p = getPage(row.dataset.pid);
    const it = getItem(p, row.dataset.aid, row.dataset.iid);
    if(!it || !it.contacts[ci]) return;
    const v = el.value.trim();
    if(v){
      it.contacts[ci].tags = it.contacts[ci].tags || [];
      if(!it.contacts[ci].tags.includes(v)) it.contacts[ci].tags.push(v);
      el.value = '';
      saveState();
      const tagList = el.closest('.ct-tag-list');
      const tag = document.createElement('span');
      tag.className = 'tag-mini';
      tag.innerHTML = `${esc(v)}<b data-act="delctag" data-ci="${ci}" data-ti="${it.contacts[ci].tags.length-1}">✕</b>`;
      tagList.insertBefore(tag, el);
      setTimeout(() => { alignSupplierRows(); updateStickyHeights(); }, 30);
    }
    return;
  }

  if(e.key === 'Enter' && el.dataset && el.dataset.f === 'note'){
    e.preventDefault();
    const row = el.closest('[data-iid]');
    const p = getPage(row.dataset.pid);
    const it = getItem(p, row.dataset.aid, row.dataset.iid);
    if(it){
      it.notes = it.notes || [];
      it.notes.push('');
      saveState();
      const cell = row.querySelector('[data-col="note"]');
      cell.innerHTML = notesHTML(it);
      const inputs = cell.querySelectorAll('[data-f="note"]');
      inputs[inputs.length-1].focus();
    }
  }
});

function finalizeExpiry(input, st){
  if(!st.y) return;
  if(st.y.length < 2){ st.y = st.y.padStart(2, '0'); }
  if(st.m && !st.d){
    const y = +('20' + st.y);
    const m = parseInt(st.m, 10) || 1;
    const last = new Date(y, m, 0).getDate();
    st.d = String(last);
    st.stage = 'done';
  }else if(st.y && !st.m){
    st.m = '01'; st.d = '01'; st.stage = 'done';
  }else if(st.d){
    st.d = st.d.padStart(2, '0');
    st.stage = 'done';
  }
  renderExpiry(input, st);
  syncExpiryToItem(input);
}

document.addEventListener('focusout', e => {
  const el = e.target;

  if(el.dataset && el.dataset.f === 'extra-expiry'){
    const ei = +el.dataset.ei;
    const row = el.closest('[data-iid]');
    if(!row) return;
    const p = getPage(row.dataset.pid);
    const it = getItem(p, row.dataset.aid, row.dataset.iid);
    if(!it || !Array.isArray(it.extras) || !it.extras[ei]) return;
    const norm = normalizeDate8(el.value);
    if(norm){
      it.extras[ei].expiry = norm;
      el.value = norm;
    }else{
      el.value = it.extras[ei].expiry || '';
    }
    saveState();
    return;
  }

  if(el.dataset && el.dataset.f === 'code'){
    const row = el.closest('[data-iid]');
    if(row){
      const p = getPage(row.dataset.pid);
      const it = getItem(p, row.dataset.aid, row.dataset.iid);
      if(it) refreshDuplicatesFor(it.code);
    }
  }
  if(el.dataset && el.dataset.f === 'expiry'){
    const st = getExpiryState(el);
    finalizeExpiry(el, st);
  }
  if(el.dataset && el.dataset.f === 'baseQty'){
    const row = el.closest('[data-iid]');
    if(!row) return;
    const p = getPage(row.dataset.pid);
    const it = getItem(p, row.dataset.aid, row.dataset.iid);
    if(!it) return;
    let n = parseNonNegInt(el.value);
    if(n === null || n < 0) n = 0;
    it.baseQty = n; el.value = n;
    saveState();
  }

  if(el.dataset && el.dataset.f === 'curQty'){
    const row = el.closest('[data-iid]');
    if(!row) return;
    const p = getPage(row.dataset.pid);
    const it = getItem(p, row.dataset.aid, row.dataset.iid);
    if(!it) return;

    let n = parseNonNegInt(el.value);
    if(n === null || n < 0) n = 0;

    it.curQty = n;

    if(n === 0){
      const promoted = autoPromoteFromExtras(it);
      if(promoted){
        el.value = it.curQty;
        toast('已自動提升有效日期最近的批次 → ' + it.curQty);
        rebuildQtyCell(row, it);
        rebuildExpiryCell(row, it);
      }else{
        el.value = n;
      }
    }else{
      el.value = n;
    }

    const shouldBeOut = (it.curQty <= 0);
    if(shouldBeOut !== it.out){
      it.out = shouldBeOut;
      syncOutBtn(row, it);
    }
    updateRowStatus(row);
    saveState();
  }

  if(el.dataset && el.dataset.f === 'extra-qty'){
    const ei = +el.dataset.ei;
    const row = el.closest('[data-iid]');
    if(!row) return;
    const p = getPage(row.dataset.pid);
    const it = getItem(p, row.dataset.aid, row.dataset.iid);
    if(!it || !Array.isArray(it.extras) || !it.extras[ei]) return;
    let n = parseNonNegInt(el.value);
    if(n === null || n < 0) n = 0;
    it.extras[ei].qty = n;
    el.value = n;
    saveState();
  }
});

document.addEventListener('focusin', e => {
  const el = e.target;
  if(el.dataset && el.dataset.f === 'expiry'){
    getExpiryState(el);
    setTimeout(() => { try{ el.select(); }catch(_){} }, 0);

    setTimeout(() => { try{ el.select(); }catch(_){} }, 0);
  }
});

let draggingSupplier = null;
let draggingContact = null;
let draggingItem = null;
let draggingArea = null;

document.addEventListener('dragstart', e => {
  const supHandle = e.target.closest('.supplier-drag-handle');
  if(supHandle){
    const row = supHandle.closest('[data-iid]');
    if(!row) return;
    draggingSupplier = { pid: row.dataset.pid, aid: row.dataset.aid, iid: row.dataset.iid };
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', 'supplier'); }catch(_){}
    row.classList.add('dragging-row');
    return;
  }

  const ctHandle = e.target.closest('.contact-drag-handle');
  if(ctHandle){
    const block = ctHandle.closest('.contact-block');
    const row = block.closest('[data-iid]');
    if(!row) return;
    draggingContact = {
      pid: row.dataset.pid, aid: row.dataset.aid, iid: row.dataset.iid,
      fromIdx: +block.dataset.ci,
    };
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', 'contact'); }catch(_){}
    block.classList.add('dragging-contact');
    return;
  }

  const itemHandle = e.target.closest('.item-drag-handle');

    const row = itemHandle.closest('[data-iid]');
    if(!row) return;
    draggingItem = {
      pid: row.dataset.pid, aid: row.dataset.aid, iid: row.dataset.iid,
    };
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', 'item'); }catch(_){}
    row.classList.add('dragging-row');
    return;
  }

  const areaHandle = e.target.closest('.area-drag-handle');
  if(areaHandle){
    const areaEl = areaHandle.closest('.area');
    const pageEl = areaHandle.closest('[data-pageid]');
    if(!areaEl || !pageEl) return;
    draggingArea = {
      pid: pageEl.dataset.pageid,
      aid: areaEl.dataset.aid,
    };
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', 'area'); }catch(_){}
    areaEl.classList.add('dragging-area');
    return;
  }
});

document.addEventListener('dragend', () => {
  draggingSupplier = null;
