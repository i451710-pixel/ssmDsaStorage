/* ============ 點擊事件 ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t){
    const g = e.target.closest('[data-goto]');
    if(g){ currentView = g.dataset.goto; render(); return; }

    const head = e.target.closest('.area-head');
    if(head){
      if(e.target.closest('.area-drag-handle') ||
         e.target.closest('.area-name') ||
         e.target.closest('input') ||
         e.target.closest('button') ||
         e.target.closest('select')){
        return;
      }
      const areaEl = head.closest('.area');
      const pageEl = head.closest('[data-pageid]');
      toggleAreaCollapse(areaEl, pageEl);
    }
    return;
  }
  const act = t.dataset.act;

  if(act === 'font-up' || act === 'font-down' || act === 'font-reset'){
    if(act === 'font-up')    state.fontScale = Math.min(1.5, +(state.fontScale + 0.05).toFixed(2));
    if(act === 'font-down')  state.fontScale = Math.max(0.8, +(state.fontScale - 0.05).toFixed(2));
    if(act === 'font-reset') state.fontScale = 1;
    applyFontScale();
    saveState();
    if(currentView === 'admin') renderContent();
    return;
  }

  if(act === 'add-page'){ openAddPageModal(); return; }
  if(act === 'export'){ openExportModal(); return; }
  if(act === 'admin'){ currentView = 'admin'; render(); return; }
  if(act === 'logout'){
    confirmBox('確定要登出嗎？', () => {
      $('#app').classList.remove('on');
      $('#login').style.display = 'flex';
      $('#empInput').value = '';
      $('#loginErr').textContent = '';
      $('#empInput').focus();
    });
    return;
  }

  if(act === 'backup-json'){
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    downloadBlob(blob, `倉存備份_${stamp()}.json`);
    toast('備份已匯出');
    return;
  }
  if(act === 'restore-json'){ restoreJSON(); return; }
  if(act === 'export-all-xlsx'){ exportXLSX(state.pages.map(p => p.id), '全部倉庫'); return; }
  if(act === 'wipe'){
    confirmBox('⚠ 這將永久刪除本機所有倉存資料，無法復原！確定要清空嗎？', () => {
      confirmBox('最後確認：真的要清空所有資料嗎？', () => {
        state.pages = [];
        state.colWidths = {};
        state.customContacts = [];
        saveState();
        currentView = 'overview';
        render();
        toast('所有資料已清空');
      });
    });
    return;
  }

  const wrap = t.closest('[data-pageid]');
  let pageId = wrap?.dataset.pageid;
  if(!pageId && !['overview','admin','search'].includes(currentView)) pageId = currentView;
  const page = pageId ? getPage(pageId) : null;

  if(act === 'add-area' && page){
    page.areas.push(newArea(`區域 ${page.areas.length + 1}`));
    saveState(); render();
    return;
  }
  if(act === 'export-page' && page){ exportXLSX([page.id], page.name); return; }
  if(act === 'toggle-code'){
    state.codeMode = state.codeMode === 'qrcode' ? 'barcode' : 'qrcode';
    saveState(); render();
    toast(state.codeMode === 'qrcode' ? '已切換為二維碼' : '已切換為一維碼');
    return;
  }

  if(act === 'toggle-area'){
    const areaEl = t.closest('.area');
    const pageEl = t.closest('[data-pageid]');
    toggleAreaCollapse(areaEl, pageEl);
    return;
  }

  if((act === 'expand-all' || act === 'collapse-all') && page){
    const collapse = act === 'collapse-all';
    page.areas.forEach(a => a.collapsed = collapse);
    saveState(); render();
    toast(collapse ? '已折疊全部區域' : '已展開全部區域');
    return;
  }

  const areaEl = t.closest('[data-aid]');
  const area = (page && areaEl) ? getArea(page, areaEl.dataset.aid) : null;

  if(act === 'add-item' && page && area){
    addItemToAreaLocal(page, area);
    return;
  }

  if(act === 'del-area' && page && area){
    confirmBox(`確定刪除區域「${area.name}」及其 ${area.items.length} 項資料？`, () => {
      page.areas = page.areas.filter(a => a.id !== area.id);
      saveState(); render();
      toast('區域已刪除');
    });
    return;
  }

  const row = t.closest('[data-iid]');
  if(!row) return;
  const item = (page) ? getItem(page, row.dataset.aid, row.dataset.iid) : null;
  if(!item) return;

  if(act === 'del-item'){
    confirmBox('確定刪除此項資料？', () => {
      const a = getArea(page, row.dataset.aid);
      a.items = a.items.filter(i => i.id !== item.id);
      saveState(); render();
      toast('已刪除');
    });
    return;
  }

  if(act === 'toggle-out'){
    if(!item.out){
      item.curQty = 0;
      const promoted = autoPromoteFromExtras(item);
      if(promoted){
        item.out = false;
        toast('已自動提升有效日期最近的批次 → ' + item.curQty);
      }else{
        item.out = true;
      }
    }else{
      item.out = false;
    }
    saveState();
    syncOutBtn(row, item);
    updateRowStatus(row);
    rebuildQtyCell(row, item);
    rebuildExpiryCell(row, item);
    return;
  }

  if(act === 'add-extra'){
    if(!Array.isArray(item.extras)) item.extras = [];
    item.extras.push({ qty: 0, expiry: '' });
    saveState();
    rebuildQtyCell(row, item);
    rebuildExpiryCell(row, item);
    setTimeout(() => {
      const idx = item.extras.length - 1;
      const newInput = row.querySelector(`.qty-extra-row[data-ei="${idx}"] [data-f="extra-qty"]`);
      if(newInput){ newInput.focus(); try{ newInput.select(); }catch(_){} }
    }, 30);
    return;
  }

  if(act === 'del-extra'){
    const ei = +t.dataset.ei;
    if(Array.isArray(item.extras)){
      item.extras.splice(ei, 1);
      saveState();
      rebuildQtyCell(row, item);
      rebuildExpiryCell(row, item);
    }
    return;
  }

  if(act === 'toggle-no-expiry'){
    item.noExpiry = !item.noExpiry;
    saveState();
    rebuildExpiryCell(row, item);
    rebuildQtyCell(row, item);
    updateRowStatus(row);
    toast(item.noExpiry ? '已設為不過期' : '已恢復有效日期');
    return;
  }

  if(act === 'addnote'){
    item.notes = item.notes || [];
    item.notes.push('');
    saveState();
    const cell = row.querySelector('[data-col="note"]');
    cell.innerHTML = notesHTML(item);
    const inputs = cell.querySelectorAll('[data-f="note"]');
    inputs[inputs.length-1].focus();
    return;
  }
  if(act === 'delnote'){
    const i = +t.dataset.ni;
    item.notes.splice(i, 1);
    if(!item.notes.length) item.notes.push('');
    saveState();
    const cell = row.querySelector('[data-col="note"]');
    cell.innerHTML = notesHTML(item);
    return;
  }

  if(act === 'addcontact'){
    item.contacts = item.contacts || [];
    item.contacts.push({ name:'', phone:'', tags:[] });
    saveState(); render();
    setTimeout(() => { alignSupplierRows(); updateStickyHeights(); }, 30);
    return;
  }
  if(act === 'delcontact'){
    const ci = +t.dataset.ci;
    item.contacts.splice(ci, 1);
    if(!item.contacts.length) item.contacts.push({ name:'', phone:'', tags:[] });
    saveState(); render();
    setTimeout(() => { alignSupplierRows(); updateStickyHeights(); }, 30);
    return;
  }
  if(act === 'delctag'){
    const ci = +t.dataset.ci, ti = +t.dataset.ti;
    if(item.contacts[ci] && item.contacts[ci].tags){
      item.contacts[ci].tags.splice(ti, 1);
      saveState(); render();
      setTimeout(() => { alignSupplierRows(); updateStickyHeights(); }, 30);
    }
    return;
  }
});

/* ============ 右鍵菜單 ============ */
const ctx = $('#ctxmenu');

document.addEventListener('contextmenu', e => {
  const inp = e.target.closest('input[data-ctxcontact], textarea[data-ctxcontact]');
  if(!inp) return;
  e.preventDefault();

  const row = inp.closest('[data-iid]');
  if(!row) return;
  const p = getPage(row.dataset.pid);
  const it = getItem(p, row.dataset.aid, row.dataset.iid);
  if(!it) return;

  if(!Array.isArray(it.contactList)) it.contactList = [];

  const list = getAllContactsFull();
  const selected = new Set(it.contactList);

  let h = `<div class="ctx-t">選擇聯絡人員（可多選）</div>`;
  if(!list.length){
    h += `<div class="ctx-empty">（尚無供應商聯絡人）</div>`;
  }else{
    list.forEach(c => {
      const checked = selected.has(c.label) ? 'checked' : '';
      const tags = (c.tags && c.tags.length) ? ` [${c.tags.join('·')}]` : '';
      h += `<label class="ctx-check">
        <input type="checkbox" data-pick-label="${esc(c.label)}" ${checked}>
        <span>${esc(c.label)}${esc(tags)}</span>
      </label>`;
    });
  }
  h += `<div class="ctx-actions">
    <button class="ctx-btn" data-ctx-cancel>取消</button>
    <button class="ctx-btn primary" data-ctx-ok>確定</button>
  </div>`;
  ctx.innerHTML = h;

  ctx.style.display = 'block';
  ctx.style.left = '0px';
  ctx.style.top = '0px';
  const r = ctx.getBoundingClientRect();
  let x = e.clientX, y = e.clientY;
  if(x + r.width > innerWidth - 8) x = innerWidth - r.width - 8;
  if(y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  if(x < 4) x = 4;
  if(y < 4) y = 4;
  ctx.style.left = x + 'px';
  ctx.style.top = y + 'px';

  ctx.addEventListener('wheel', ev => { ev.stopPropagation(); }, { passive: true });

  ctx.onclick = ev => {
    if(ev.target.closest('[data-ctx-cancel]')){ closeCtx(); return; }
    if(ev.target.closest('[data-ctx-ok]')){
      const checks = ctx.querySelectorAll('input[data-pick-label]:checked');
      it.contactList = [...checks].map(c => c.dataset.pickLabel);
      saveState();
      closeCtx();
      render();
      toast(it.contactList.length ? `已選擇 ${it.contactList.length} 位聯絡人` : '已清除聯絡人');
      return;
    }
  };
});

function closeCtx(){
  ctx.style.display = 'none';
  ctx.onclick = null;
}

document.addEventListener('click', e => {
  if(!e.target.closest('#ctxmenu')) closeCtx();
});
document.addEventListener('scroll', e => {
  if(ctx.contains(e.target)) return;
  closeCtx();
}, true);

let resizing = null;

document.addEventListener('mousedown', e => {
  const rz = e.target.closest('.rz');
  if(!rz) return;
  e.preventDefault();
  const type = rz.dataset.type;
  const col  = rz.dataset.col;
  const w = getWidths(type);
  resizing = { type, col, startX: e.clientX, startW: w[col] };
  document.body.classList.add('resizing');
});

  if(!resizing) return;
  const nw = Math.max(48, Math.round(resizing.startW + (e.clientX - resizing.startX)));
  if(!state.colWidths[resizing.type]) state.colWidths[resizing.type] = {};
  state.colWidths[resizing.type][resizing.col] = nw;
  document.querySelectorAll(
    `.cell[data-col="${resizing.col}"][data-type="${resizing.type}"]`
  ).forEach(el => {
    el.style.width = nw + 'px';
    el.style.minWidth = nw + 'px';
    const ta = el.querySelector('.name-area');
    if(ta) autoResize(ta);
  });
  if(resizing.type === 'supplier') alignSupplierRows();
  alignQtyExpiryRows();
  updateStickyHeights();
});

document.addEventListener('mouseup', () => {
  if(!resizing) return;
  resizing = null;
  document.body.classList.remove('resizing');
  saveState();
});

/* ============ 匯出 Excel ============ */
function stamp(){
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
}
function todayStamp(){
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function sanitizeSheetName(name){
  let s = String(name || 'Sheet').replace(/[\\\/\?\*\[\]:]/g, '_').trim();
  if(!s) s = 'Sheet';
  if(s.length > 31) s = s.slice(0, 31);
  return s;
}

function exportXLSX(pageIds, label){
  if(typeof XLSX === 'undefined'){
    toast('Excel 模組未載入，請檢查網路後重試');
    return;
  }
  const today = todayStamp();
  const wb = XLSX.utils.book_new();
  const usedNames = new Set();

  pageIds.forEach(pid => {
    const p = getPage(pid);
    if(!p) return;

    const aoa = [];
    aoa.push(['倉存管理系統 - 匯出報表']);
    aoa.push(['倉庫', p.name]);
    aoa.push(['匯出日期', today]);
    aoa.push(['匯出人員', state.empId]);
    aoa.push([]);

    if(p.type === 'supplier'){
      aoa.push(['供應商','聯絡人員','電話','聯絡人標籤']);
      p.areas.forEach(a => a.items.forEach(it => {
        const cs = it.contacts || [];
        if(!cs.length){
          aoa.push([it.name || '', '', '', '']);
        }else{
          cs.forEach((c, idx) => {
            aoa.push([
              idx === 0 ? (it.name || '') : '',
              c.name || '',
              c.phone || '',
              (c.tags || []).join('、'),
            ]);
          });
        }
      }));
    }else{
      aoa.push(['物品編號','物品名稱','備注','基數量','現存量','有效日期','追加批次']);
      p.areas.forEach(a => a.items.forEach(it => {
        const extrasText = (it.extras || [])
          .filter(ex => ex.qty > 0 || ex.expiry)
          .map(ex => it.noExpiry ? `${ex.qty ?? 0}` : `${ex.qty ?? 0} (${ex.expiry || '—'})`)
          .join('；');
        aoa.push([
          it.code || '',
          it.name || '',
          (it.notes || []).filter(Boolean).join(' / '),
          (it.baseQty ?? '') === '' ? '' : Number(it.baseQty ?? 0),
          (it.curQty  ?? '') === '' ? '' : Number(it.curQty  ?? 0),
          it.noExpiry ? '不過期' : (it.expiry || ''),
          extrasText,
        ]);
      }));
    }

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [
      { wch: 18 }, { wch: 24 }, { wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 28 }
    ];
    ws['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:6} }];

    let sheetName = sanitizeSheetName(p.name);
    let base = sheetName, n = 1;
    while(usedNames.has(sheetName)){
      const suffix = '_' + (++n);
      sheetName = base.slice(0, 31 - suffix.length) + suffix;
    }
    usedNames.add(sheetName);

    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  const fname = `${label}_${today}.xlsx`;
  try{
    XLSX.writeFile(wb, fname);
    toast('已匯出 Excel：' + fname);
  }catch(err){
    console.error(err);
    toast('匯出失敗：' + err.message);
  }
}

function restoreJSON(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.pages)) throw new Error('格式錯誤');
        migrateData(d);
        confirmBox(`將匯入 ${d.pages.length} 個頁面，現有資料會被覆蓋。確定繼續？`, () => {
          state.pages = d.pages;
          state.colWidths = d.colWidths || {};
          state.codeMode = d.codeMode || 'qrcode';
          state.customContacts = Array.isArray(d.customContacts) ? d.customContacts : [];
          if(typeof d.fontScale === 'number') state.fontScale = d.fontScale;
          migrateData(state);
          saveState();
          applyFontScale();
          currentView = 'overview';
          render();
          toast('備份已還原');
        });
      }catch(err){
        alert('備份檔格式不正確：' + err.message);
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============ 彈窗 ============ */
function closeModal(){ $$('.modal-bg').forEach(m => m.remove()); }

function openModal({ title, body, onOk, okText = '確定', cancelText = '取消' }){
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3>${esc(title)}</h3>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">
      <button class="btn" data-m="cancel">${esc(cancelText)}</button>
      ${onOk ? `<button class="btn primary" data-m="ok">${esc(okText)}</button>` : ''}
    </div>
  </div>`;
  document.body.appendChild(bg);

  bg.addEventListener('click', e => {
    if(e.target === bg) closeModal();
    const b = e.target.closest('[data-m]');
    if(!b) return;
    if(b.dataset.m === 'cancel') closeModal();
    if(b.dataset.m === 'ok' && onOk){ if(onOk(bg) !== false) closeModal(); }
  });

  setTimeout(() => {
    const first = bg.querySelector('input,select,textarea');
    if(first) first.focus();
  }, 40);

  return bg;
}

function confirmBox(msg, onOk){
  openModal({
    title: '確認',
    body: `<div style="font-size:.84rem;line-height:1.7">${esc(msg)}</div>`,
    okText: '確定',
    onOk: () => { onOk(); }
  });
}

function openAddPageModal(){

    body: `<div class="field">
        <label>頁面名稱</label>
        <input type="text" id="npName" placeholder="例如：主倉庫">
      </div>
      <div class="field">
        <label>頁面類型</label>
        <select id="npType">
          <option value="common">📦 共用物品</option>
          <option value="special">🔧 專用物品</option>
          <option value="consign">🏷️ 寄沽物品</option>
          <option value="supplier">🏢 供應商資料</option>
        </select>
      </div>`,
    okText: '建立',
    onOk: () => {
      const type = $('#npType').value;
      const name = $('#npName').value.trim() || TYPES[type].label;
      const p = newPage(type, name);
      state.pages.push(p);
      currentView = p.id;
      saveState();
      render();
      toast('頁面已建立');
    }
  });
}

function openExportModal(){
  if(!state.pages.length){
    toast('尚無頁面可匯出');
    return;
  }
  let list = '';
  state.pages.forEach(p => {
    list += `<label><input type="checkbox" class="exp-p" value="${p.id}" checked>
      ${TYPES[p.type].icon} ${esc(p.name)}
      <span style="color:#9aa4b5;font-size:.72rem">（${p.areas.reduce((s,a)=>s+a.items.length,0)} 項）</span>
    </label>`;
  });

  const bg = openModal({
    title: '匯出 Excel',
    body: `<div class="field">
        <label>選擇要匯出的倉庫 / 頁面</label>
        <div class="checklist">
          <label style="border-bottom:1px solid #eef1f6;margin-bottom:4px">
            <input type="checkbox" id="expAll" checked> <b>全選 / 共同匯出</b>
          </label>
          ${list}
        </div>
      </div>
      <div style="font-size:.75rem;color:#7a8395">
        匯出格式為 Excel (.xlsx)，每個倉庫一個工作表，可直接用 Excel / Numbers 開啟。
      </div>`,
    okText: '匯出 Excel',
    onOk: () => {
      const ids = $$('.exp-p').filter(c => c.checked).map(c => c.value);
      if(!ids.length){ toast('請至少選擇一個頁面'); return false; }
      const label = ids.length === state.pages.length ? '全部倉庫' : (getPage(ids[0])?.name || '匯出');
      exportXLSX(ids, label);
    }
  });

  bg.querySelector('#expAll').addEventListener('change', e => {
    bg.querySelectorAll('.exp-p').forEach(c => c.checked = e.target.checked);
  });
  bg.addEventListener('change', e => {
    if(e.target.classList.contains('exp-p')){
      const all = bg.querySelectorAll('.exp-p');
      const checked = bg.querySelectorAll('.exp-p:checked');
      bg.querySelector('#expAll').checked = all.length === checked.length;
      bg.querySelector('#expAll').indeterminate = checked.length > 0 && checked.length < all.length;
    }
  });
}

/* ============ 搜索 ============ */
let searchTimer = null;
$('#search').addEventListener('input', e => {
  const v = e.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = v;
    if(v) currentView = 'search';
    else if(currentView === 'search') currentView = 'overview';
    render();
  }, 200);
});

/* ============ 側邊欄收合 ============ */
$('#menuBtn').addEventListener('click', () => {
  $('#sidebar').classList.toggle('collapsed');
  setTimeout(() => { autoResizeAllNames(); alignSupplierRows(); alignQtyExpiryRows(); updateStickyHeights(); }, 250);
});

/* ============ 視窗尺寸變化 ============ */
let _alignTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_alignTimer);
  _alignTimer = setTimeout(() => {
    autoResizeAllNames();
    alignSupplierRows();
    alignQtyExpiryRows();
    updateStickyHeights();
  }, 120);
});

/* ============ 啟動 ============ */
async function initApp() {
    // 先嘗試載入本地快取
    try {
        const raw = localStorage.getItem(LS_KEY);
        if(raw) {
            const d = JSON.parse(raw);
            state.pages = d.pages || [];
            state.empId = d.empId || '';
            state.colWidths = d.colWidths || {};
            state.codeMode = d.codeMode || 'qrcode';
            state.fontScale = d.fontScale || 1;
            state.customContacts = d.customContacts || [];
            migrateData(state);
        }
    } catch(e){}

    // 等待 Firebase API 準備就緒
    let retries = 0;
    while (!window.firebaseAPI && retries < 20) {
        await new Promise(r => setTimeout(r, 200));
        retries++;
    }
    
    if (window.firebaseAPI) {
        await loadStateFromCloud();
    } else {
        console.warn("⚠️ Firebase 無法載入，使用離線模式");
    }

    initLogin();
}

initApp();

</script>
